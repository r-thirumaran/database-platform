name: build

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test all Java modules
        run: mvn -B -ntp verify
      - name: Upload driver jar
        uses: actions/upload-artifact@v4
        with:
          name: dbp-jdbc
          path: dbp-jdbc/target/dbp-jdbc-*-all.jar
          if-no-files-found: ignore

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbp-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dbp-ui/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dbp-ui-dist
          path: dbp-ui/dist

  docker:
    runs-on: ubuntu-latest
    needs: [java, ui]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (no push)
        run: |
          for c in control-plane gateway proxy; do
            docker build -f deploy/docker/Dockerfile.$c -t dbp-$c:ci . || exit 1
          done
