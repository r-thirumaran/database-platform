# Prometheus scrape configuration for the demo stack (deploy/docker-compose.yml, profile "monitoring").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Control plane: Spring Boot actuator (JVM, http_server_requests_*, hikaricp_* of the metadata store).
  # The POC control plane exports no custom dbp_* meters; platform counts come from its REST API.
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:8080"]
        labels:
          component: control-plane

  # Gateway admin port: /metrics (Prometheus text format, dbp_gateway_* + JVM); no authentication
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:7421"]
        labels:
          component: gateway

  # Proxy admin port: /metrics (dbp_proxy_*). /metrics and /health are always open; only /connections
  # and /config require X-DBP-Service-Token, so no bearer configuration is needed here.
  - job_name: proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["proxy:7431"]
        labels:
          component: proxy

  # Example applications: HikariCP pool metrics (client-side view of connections).
  # Only orders-service bundles micrometer-registry-prometheus; legacy-reporting exposes
  # /actuator/health and /actuator/metrics but no /actuator/prometheus, so it is not scraped.
  - job_name: examples
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orders-service-direct:8080"]
        labels: { component: example, app: orders-service, mode: direct }
      - targets: ["orders-service-proxy:8080"]
        labels: { component: example, app: orders-service, mode: proxy }
      - targets: ["orders-service-gateway:8080"]
        labels: { component: example, app: orders-service, mode: gateway }
