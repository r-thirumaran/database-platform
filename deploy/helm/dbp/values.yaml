# Default values for the dbp chart. Minimal but functional: three Deployments + Services, a gateway
# HPA, PodDisruptionBudgets and (optionally) the database NetworkPolicies.
nameOverride: ""
fullnameOverride: ""

image:
  registry: ""            # e.g. ghcr.io/example/  (with trailing slash)
  tag: 0.1.0-SNAPSHOT
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Shared non-secret configuration (ConfigMap)
config:
  securityMode: none                 # none | basic
  demoSeedEnabled: false
  telemetryRetentionHours: 72
  telemetryFlushMs: 2000
  governanceIntervalSeconds: 300
  metadataDb:
    url: jdbc:postgresql://dbp-metadata-db:5432/dbp
    user: dbp

# Secrets: either let the chart create them (dev) or reference an existing Secret with the same keys
# (DBP_SERVICE_TOKEN, DBP_MASTER_KEY, DBP_DB_PASSWORD, plus every ENV credential ref the control plane needs).
secrets:
  create: true
  existingSecret: ""
  serviceToken: change-me-service-token
  masterKey: change-me-change-me-change-me-32chars
  dbPassword: change-me
  # ENV credential refs used in the imported platform configuration (control plane only)
  extra:
    SALES_APP_PASSWORD: change-me
    DBP_COLLECTOR_PASSWORD: change-me

controlPlane:
  enabled: true
  replicas: 1
  image: dbp/control-plane
  port: 8080
  springProfile: postgres
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    host: dbp.example.org
    annotations: {}
    tls: []

gateway:
  enabled: true
  replicas: 2
  image: dbp/gateway
  port: 7420
  adminPort: 7421
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 1Gi }
  service:
    type: ClusterIP
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 60

proxy:
  enabled: true
  replicas: 2
  image: dbp/proxy
  ports:
    oracle: 1521
    postgres: 5432
    mssql: 1433
    admin: 7431            # /health and /metrics open; /connections and /config need X-DBP-Service-Token
  strictAliases: false     # DBP_PROXY_STRICT_ALIASES: refuse <datasource>.<alias> when no application declares <alias>
  unknownAppMaxConnections: 0   # DBP_PROXY_UNKNOWN_APP_MAX_CONNECTIONS: per-datasource cap for unidentified callers (0 = unlimited)
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 768Mi }
  service:
    type: ClusterIP
  pdb:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 120

# NetworkPolicies: only gateway/proxy/control-plane may reach the database CIDRs on the database ports
networkPolicy:
  enabled: false
  databaseCidrs:
    - 10.100.0.0/16
  databasePorts: [1521, 5432, 1433]
  consumerNamespaceLabel: "dbp.io/consumer"
  monitoringNamespaceLabel: "dbp.io/monitoring"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

nodeSelector: {}
tolerations: []
affinity: {}
