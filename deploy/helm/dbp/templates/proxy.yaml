{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbp.fullname" . }}-proxy
  labels:
    {{- include "dbp.labels" . | nindent 4 }}
    {{- include "dbp.selectorLabels" (dict "root" . "component" "proxy") | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "dbp.selectorLabels" (dict "root" . "component" "proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dbp.selectorLabels" (dict "root" . "component" "proxy") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.proxy.ports.admin | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.proxy.terminationGracePeriodSeconds }}
      containers:
        - name: proxy
          image: {{ include "dbp.image" (dict "root" . "repository" .Values.proxy.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: oracle
              containerPort: {{ .Values.proxy.ports.oracle }}
            - name: postgres
              containerPort: {{ .Values.proxy.ports.postgres }}
            - name: mssql
              containerPort: {{ .Values.proxy.ports.mssql }}
            - name: admin
              containerPort: {{ .Values.proxy.ports.admin }}
          env:
            - name: DBP_PROXY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DBP_CONTROL_PLANE_URL
              value: {{ include "dbp.controlPlaneUrl" . | quote }}
            - name: DBP_PROXY_ADMIN_PORT
              value: {{ .Values.proxy.ports.admin | quote }}
            - name: DBP_PROXY_STRICT_ALIASES
              value: {{ .Values.proxy.strictAliases | quote }}
            - name: DBP_PROXY_UNKNOWN_APP_MAX_CONNECTIONS
              value: {{ .Values.proxy.unknownAppMaxConnections | quote }}
            - name: DBP_TELEMETRY_FLUSH_MS
              value: {{ .Values.config.telemetryFlushMs | quote }}
            - name: DBP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbp.secretName" . }}
                  key: DBP_SERVICE_TOKEN
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: oracle }
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbp.fullname" . }}-proxy
  labels:
    {{- include "dbp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.proxy.service.type }}
  selector:
    {{- include "dbp.selectorLabels" (dict "root" . "component" "proxy") | nindent 4 }}
  ports:
    - name: oracle
      port: {{ .Values.proxy.ports.oracle }}
      targetPort: oracle
    - name: postgres
      port: {{ .Values.proxy.ports.postgres }}
      targetPort: postgres
    - name: mssql
      port: {{ .Values.proxy.ports.mssql }}
      targetPort: mssql
    - name: admin
      port: {{ .Values.proxy.ports.admin }}
      targetPort: admin
{{- if .Values.proxy.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dbp.fullname" . }}-proxy
  labels:
    {{- include "dbp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.proxy.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dbp.selectorLabels" (dict "root" . "component" "proxy") | nindent 6 }}
{{- end }}
{{- end }}
