apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dbp-gateway
  namespace: dbp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dbp-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # physical pools live in the gateway: scale down slowly so sessions can drain
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
