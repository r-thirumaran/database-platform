# Template: copy to secret.yaml, replace every value, apply. Or create it imperatively:
#   kubectl -n dbp create secret generic dbp-secrets \
#     --from-literal=DBP_SERVICE_TOKEN=... --from-literal=DBP_MASTER_KEY=... \
#     --from-literal=DBP_DB_PASSWORD=... --from-literal=SALES_APP_PASSWORD=... \
#     --from-literal=DBP_COLLECTOR_PASSWORD=...
# SALES_APP_PASSWORD / DBP_COLLECTOR_PASSWORD are the ENV credential refs used in
# deploy/bootstrap/platform-config.json; only the control plane needs them.
apiVersion: v1
kind: Secret
metadata:
  name: dbp-secrets
  namespace: dbp
type: Opaque
stringData:
  DBP_SERVICE_TOKEN: change-me-service-token
  DBP_MASTER_KEY: change-me-change-me-change-me-32chars
  DBP_DB_PASSWORD: change-me
  SALES_APP_PASSWORD: change-me
  DBP_COLLECTOR_PASSWORD: change-me
