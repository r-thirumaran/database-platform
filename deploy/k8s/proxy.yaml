apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbp-proxy
  namespace: dbp
  labels:
    app.kubernetes.io/name: dbp-proxy
    dbp.io/component: proxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dbp-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbp-proxy
        dbp.io/component: proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7431"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # long-lived database connections: give clients time to reconnect
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: dbp-proxy
      containers:
        - name: proxy
          image: dbp/proxy:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: oracle
              containerPort: 1521
            - name: postgres
              containerPort: 5432
            - name: mssql
              containerPort: 1433
            - name: admin
              containerPort: 7431
          env:
            - name: DBP_PROXY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DBP_CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: dbp-config
                  key: DBP_CONTROL_PLANE_URL
            - name: DBP_TELEMETRY_FLUSH_MS
              valueFrom:
                configMapKeyRef:
                  name: dbp-config
                  key: DBP_TELEMETRY_FLUSH_MS
            - name: DBP_PROXY_STRICT_ALIASES
              valueFrom:
                configMapKeyRef:
                  name: dbp-config
                  key: DBP_PROXY_STRICT_ALIASES
            - name: DBP_PROXY_UNKNOWN_APP_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: dbp-config
                  key: DBP_PROXY_UNKNOWN_APP_MAX_CONNECTIONS
            # with DBP_SERVICE_TOKEN set, GET /connections and GET /config on the admin port require
            # X-DBP-Service-Token; /health (probes) and /metrics (Prometheus) stay open
            - name: DBP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dbp-secrets
                  key: DBP_SERVICE_TOKEN
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: oracle
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dbp-proxy
  namespace: dbp
  labels:
    app.kubernetes.io/name: dbp-proxy
spec:
  type: ClusterIP
  # legacy applications point their existing drivers here:
  #   jdbc:oracle:thin:@//dbp-proxy.dbp.svc.cluster.local:1521/<datasource>.<application-alias>
  #   jdbc:postgresql://dbp-proxy.dbp.svc.cluster.local:5432/<datasource>.<application-alias>
  selector:
    app.kubernetes.io/name: dbp-proxy
  ports:
    - name: oracle
      port: 1521
      targetPort: oracle
    - name: postgres
      port: 5432
      targetPort: postgres
    - name: mssql
      port: 1433
      targetPort: mssql
    - name: admin
      port: 7431
      targetPort: admin
