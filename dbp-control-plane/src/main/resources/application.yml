spring:
  application:
    name: dbp-control-plane
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.query.in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${DBP_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.dbplatform: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN

dbp:
  service-token: ${DBP_SERVICE_TOKEN:dev-service-token}
  master-key: ${DBP_MASTER_KEY:}
  component-healthy-seconds: ${DBP_COMPONENT_HEALTHY_SECONDS:30}
  security:
    mode: ${DBP_SECURITY_MODE:none}
    admin-user: ${DBP_ADMIN_USER:admin}
    admin-password: ${DBP_ADMIN_PASSWORD:admin}
  telemetry:
    retention-hours: ${DBP_TELEMETRY_RETENTION_HOURS:72}
    stats-retention-days: ${DBP_QUERY_STATS_RETENTION_DAYS:30}
    cleanup-interval-seconds: ${DBP_TELEMETRY_CLEANUP_INTERVAL_SECONDS:600}
  governance:
    enabled: ${DBP_GOVERNANCE_ENABLED:true}
    interval-seconds: ${DBP_GOVERNANCE_INTERVAL_SECONDS:300}
  relationship:
    stale-days: ${DBP_RELATIONSHIP_STALE_DAYS:30}
  demo:
    seed-enabled: ${DBP_DEMO_SEED_ENABLED:true}
    seed-on-startup: ${DBP_SEED_ON_STARTUP:false}
  collector:
    enabled: ${DBP_COLLECTOR_ENABLED:true}
    tick-seconds: ${DBP_COLLECTOR_TICK_SECONDS:5}
    connect-timeout-seconds: ${DBP_COLLECTOR_CONNECT_TIMEOUT_SECONDS:10}
    max-sql-per-sample: ${DBP_COLLECTOR_MAX_SQL_PER_SAMPLE:200}
  cors:
    allowed-origins: ${DBP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DBP_DB_URL:jdbc:h2:file:./data/dbp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DBP_DB_USER:sa}
    password: ${DBP_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DBP_DB_URL:jdbc:postgresql://localhost:5432/dbp}
    username: ${DBP_DB_USER:dbp}
    password: ${DBP_DB_PASSWORD:dbp}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DBP_DB_POOL_SIZE:10}
dbp:
  demo:
    seed-enabled: ${DBP_DEMO_SEED_ENABLED:false}
